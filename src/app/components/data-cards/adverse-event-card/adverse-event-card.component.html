
    <div class="card-header">
        <h3 class="centered mt-h mb-h">{{AdverseEventResource() | fhirTitle}}</h3>
    </div>
    <div class="card-content pt-0">
        
         @if (category()?.length) {
            <span><b>Category:</b> {{category()}}</span>
         }
         @if (seriousnessSeverity().length) {
            <span>{{seriousnessSeverity()}}</span>
         }
         @if (date().length) {
            <span><b>Date:</b> {{date()}}</span>
         }

        <button mat-raised-button type="button" color="primary" class="mt-a" (click)="openDialog()">More Info</button>
    </div>
