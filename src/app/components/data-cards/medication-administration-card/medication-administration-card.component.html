
    <div class="card-header">
        <h3 class="centered mt-h mb-h">{{med() | fhirTitle}}</h3>
    </div>
    <div class="card-content pt-0">
        <div class="card-content pt-0">

            @if (status().length) {
                <span><b>Status:</b> {{status()}}</span>
            }
            @if (category().length) {
                <span><b>Category:</b> {{category()}}</span>
            }
            @if (effective().length) {
                <span><b>Effective:</b> {{effective()}}</span>
            }
            @if (dose()?.length) {
                <span><b>Dose:</b> {{dose()}}</span>
            }
            @for (note of notes(); track i; let i = $index) {
                <span><b>Note: </b>{{note}}</span>
            }

        </div>
        <button mat-raised-button type="button" color="primary" class="mt-a" (click)="openDialog()">More Info</button>
    </div>
