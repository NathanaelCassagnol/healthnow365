
    <div class="card-header">
        <h3 class="centered mt-h mb-h">{{ConditionResource() | fhirTitle}}</h3>
    </div>
    <div class="card-content pt-0">
        
        @if (status().length) {
            <span><b>Status:</b> {{status()}}</span>
         }
         @if (category()?.length) {
             <span><b>Category:</b> {{category()}}</span>
          }
          @if (severity().length) {
              <span><b>Severity:</b> {{severity()}}</span>
           }
           @if (bodySite()?.length) {
               <span><b>Body Site:</b> {{bodySite()}}</span>
            }

        <button mat-raised-button type="button" color="primary" class="mt-a" (click)="openDialog()">More Info</button>
    </div>
