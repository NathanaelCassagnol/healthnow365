
    <div class="card-header">
        <h3 class="centered mt-h mb-h">{{immunizationResource() | fhirTitle}}</h3>
    </div>
    <div class="card-content pt-0">
        

        @if (date().length) {
            <span><b>Date:</b> {{date()}}</span>
        }
        @if (description().length) {
            <span><b>Description:</b> {{description()}}</span>
        }

        <button mat-raised-button type="button" color="primary" class="mt-a" (click)="openDialog()">More Info</button>
    </div>
